name: JReiProxyServer
version: '${version}'
main: gg.nekohosting.vanilla.jreiproxyserver.JReiProxyServer
api-version: '26.2'
author: VanillaChanny
description: Serves server recipes to JEI and REI clients, and answers their cheat-mode and recipe-transfer packets.
commands:
  jreiproxy:
    description: Administrative commands for JReiProxyServer.
    usage: /<command> <reload|resync|info>
    permission: jreiproxyserver.admin
    aliases: [jeiproxy, jrp]
  jei:
    description: Ask the server to send its recipes again.
    usage: /<command> [resync|retry]
    aliases: [rei]
permissions:
  jreiproxyserver.admin:
    description: Use the administrative commands, and bypass the /jei cooldown.
    default: op
  jreiproxyserver.cheat:
    description: Use cheat mode in JEI and REI (take, delete and place items).
    default: op

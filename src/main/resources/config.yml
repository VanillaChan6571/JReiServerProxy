# JReiProxyServer configuration

# Language used by the plugin.
# Bundled: en, zh_cn
# If you add your own file under lang/ (for example fr.yml), put "fr" here.
language: "en"

# Recipe sync
#
# Since Minecraft 1.21.2 the server no longer sends recipe data to clients, so JEI reports
# "This server does not provide recipes to JEI" and falls back to the recipes shipped with the
# client. This plugin sends them the way a mod loader would.
recipe-sync:
  # Master switch. With this off, JEI only ever shows the client's own recipes.
  enabled: true

  # Send the recipes when a player joins.
  on-join: true

  # Re-encode and resend after a datapack reload (/reload, /minecraft:reload).
  on-datapack-reload: true

  # Who is sent the full vanilla recipe book.
  # REI does not read the channel JEI uses; it builds its list from the recipe book, so it needs
  # this instead. The visible side effect is that the vanilla recipe book lists everything as
  # known. Nothing is unlocked server-side and it is not an exploit: the server still checks what
  # a player actually knows when they click a recipe.
  #   auto - only clients that announced a REI channel (default)
  #   all  - every client carrying a recipe viewer
  #   off  - nobody
  recipe-book: auto

  # Send a recipe-update packet afterwards, so a viewer that has already loaded re-reads the
  # recipes. With this off the recipes still arrive, but JEI keeps showing the client's defaults.
  trigger-recipe-update: true

  # Cooldown between uses of /jei and /rei, in seconds.
  # Each resend is the whole recipe set plus the recipe book, so it is not cheap. Players with
  # jreiproxyserver.admin are exempt. Set to 0 to remove the limit.
  player-resync-cooldown-seconds: 30

  # Tell the player in chat once the recipes have arrived.
  # JEI builds its recipe list the moment the server's own recipe packet arrives, which is before
  # any plugin is allowed to send anything, so it always prints its warning once. This line is
  # what tells the player that warning is already out of date.
  # The wording lives under sync.player-notice in the lang/ files.
  notify-player: true

# Cheat mode: taking items straight out of the recipe viewer, and deleting the held item.
cheat-mode:
  # Master switch. With this off, every take and delete request is refused.
  enabled: true

  # Also let any player in creative mode cheat, whatever their permissions.
  # With this off, only players with jreiproxyserver.cheat can (OP by default).
  allow-creative: false

# Recipe transfer: the "+" button that fills a crafting grid from the player's inventory.
recipe-transfer:
  # Master switch. REI decides whether to offer the button from whether the server registered its
  # transfer channel, so turning this off hides the button rather than failing on click.
  enabled: true

# Recipe blacklist
# Recipes listed here are left out of everything the plugin sends, which is useful for hiding
# recipes you do not want players to see.
# Example:
#  - "minecraft:stick"
#  - "another_mod:secret_item"
recipe-blacklist: []

# Log per-player sync details: client type, recipe counts, payload sizes and REI packet handling.
debug: false
